name: Feature request
description: 希望面板多一个能力，或改变现有交互
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提需求。请先说明**要解决什么问题**，再说方案 —— 很多时候换个交互更省事。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 当前哪里别扭 / 缺什么能力
      placeholder: 例如：勾选时没法按轮次整段选，只能一条条点
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
      placeholder: 例如：面板顶部加一个「按轮次选择」，输入起始轮次即可
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: 涉及哪一层
      options:
        - 前端面板（交互 / 展示）
        - 宿主路由（创建会话 / 接口）
        - 两者都要
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、草图、其他插件里类似的实现等

  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我已搜索过现有 issue（避免重复）
          required: true
        - label: 这不是 DSH 内核的问题（内核问题请去上游反馈）
          required: true
